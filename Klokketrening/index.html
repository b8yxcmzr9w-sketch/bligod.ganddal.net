<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lær klokka</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.png?v=2">
  <link rel="manifest" href="/favicon/manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-nav">
    <a href="https://bligod.ganddal.net" class="nav-back">← BliGod</a>
    <a href="/Lesetrening/" class="nav-next">📖 Lesetrening →</a>
  </nav>

  <!-- ── Innstillinger ── -->
  <div id="settings-screen" class="screen active">
    <h1>🕐 Lær klokka</h1>

    <div class="card">
      <h2>Velg modus</h2>
      <div class="mode-cards">
        <button class="mode-card active" data-mode="show-clock">
          <span class="mode-icon">🕐 → 📝</span>
          <strong>Gjett uttrykket</strong>
          <small>Klokka vises – velg riktig tid fra alternativer</small>
        </button>
        <button class="mode-card" data-mode="show-expression">
          <span class="mode-icon">📝 → 🕐</span>
          <strong>Still klokka</strong>
          <small>Klokkeslettet vises – dra minuttviserviseren til riktig posisjon</small>
        </button>
        <button class="mode-card" data-mode="both">
          <span class="mode-icon">🔀</span>
          <strong>Begge, vekslende</strong>
          <small>Oppgavene varierer mellom begge typer</small>
        </button>
      </div>
    </div>

    <div class="card collapsible collapsed" id="clock-settings-card">
      <button class="card-toggle" aria-expanded="false" aria-controls="clock-settings-body">
        <h2>Klokkevisning</h2>
        <span class="toggle-arrow">▲</span>
      </button>
      <div class="card-body" id="clock-settings-body">

      <div class="setting-row">
        <label>Uttrykksstil</label>
        <div class="radio-group">
          <label><input type="radio" name="style" value="text" checked> Norsk tekst</label>
          <label><input type="radio" name="style" value="digital"> Digital (3:15)</label>
        </div>
      </div>

      <div class="setting-row face-picker-row">
        <label>Markeringer</label>
        <div id="marks-picker" class="face-picker"></div>
      </div>

      <div class="setting-row face-picker-row">
        <label>Tall</label>
        <div id="nums-picker" class="face-picker"></div>
      </div>

      <div class="setting-row">
        <label>Vis hint («Du viser nå: …»)</label>
        <label class="toggle">
          <input type="checkbox" id="show-hint">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <label>Timeviser</label>
        <input type="color" id="hour-color" value="#1a1a2e">
      </div>

      <div class="setting-row">
        <label>Minuttsviser</label>
        <input type="color" id="minute-color" value="#e63946">
      </div>

      </div><!-- /card-body -->
    </div><!-- /card.collapsible -->

    <button id="start-btn" class="btn-primary">Start!</button>

    <!-- ── Øktlogg ── -->
    <div id="log-section">
      <h2 class="log-heading">Tidligere øvelser</h2>
      <div id="log-list"></div>
    </div>

  </div>


  <!-- ── Spill ── -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <button id="back-btn" class="btn-icon">←</button>
      <div class="score-info">
        <span id="score">0</span> riktige
        <span id="streak-display"></span>
      </div>
      <div class="header-right">
        <span id="task-timer" class="task-timer">–</span>
        <button id="sound-btn" class="btn-icon" title="Lyd av/på">🔊</button>
        <span id="task-counter">1 / 10</span>
      </div>
    </div>

    <div id="task-area"></div>

    <div id="feedback" class="feedback hidden"></div>
    <button id="next-btn" class="btn-primary hidden">Neste →</button>
  </div>


  <!-- ── Resultat ── -->
  <div id="result-screen" class="screen">
    <h2>Ferdig!</h2>
    <div class="result-stats">
      <div class="stat"><span id="final-score">0</span><label>Riktige</label></div>
      <div class="stat"><span id="final-total">10</span><label>Totalt</label></div>
      <div class="stat"><span id="final-streak">0</span><label>Beste rekke</label></div>
      <div class="stat"><span id="final-avg-time">–</span><label>Snitt/spm</label></div>
    </div>
    <div id="result-progress"></div>
    <p id="result-message"></p>
    <button id="play-again-btn" class="btn-primary">Spill igjen</button>
    <button id="settings-btn" class="btn-secondary">Innstillinger</button>
  </div>

  <script src="app.js"></script>

  <!-- Liker du dette? -->
  <div id="vote-widget" style="display:flex;flex-direction:column;align-items:center;gap:0.6rem;padding:1.5rem 0 0.5rem;">
    <p id="vote-label" style="font-size:0.78rem;color:#888888;margin:0;letter-spacing:0.05em;">Liker du dette?</p>
    <div id="vote-btns" style="display:flex;gap:0.75rem;">
      <button id="vote-up" onclick="sendVote('up')" style="background:none;border:1.5px solid #DDD5C8;border-radius:50%;width:42px;height:42px;font-size:1.2rem;cursor:pointer;line-height:1;">👍</button>
      <button id="vote-down" onclick="sendVote('down')" style="background:none;border:1.5px solid #DDD5C8;border-radius:50%;width:42px;height:42px;font-size:1.2rem;cursor:pointer;line-height:1;">👎</button>
    </div>
    <p id="vote-thanks" style="display:none;font-size:0.78rem;color:#888888;margin:0;">Takk!</p>
  </div>
  <script>
  (function(){
    var KEY = 'vote_klokketrening';
    var FORM = 'https://formspree.io/f/xzdwvpga';
    function apply(v) {
      document.getElementById('vote-up').disabled = true;
      document.getElementById('vote-down').disabled = true;
      document.getElementById('vote-label').style.display = 'none';
      document.getElementById('vote-up').style.opacity   = v === 'up'   ? '1' : '0.2';
      document.getElementById('vote-down').style.opacity = v === 'down' ? '1' : '0.2';
      document.getElementById('vote-thanks').style.display = 'block';
    }
    // Skjul widget mens spillet pågår
    var widget = document.getElementById('vote-widget');
    var gameScreen = document.getElementById('game-screen');
    function oppdaterSynlighet() {
      widget.style.display = gameScreen.classList.contains('active') ? 'none' : 'flex';
    }
    new MutationObserver(oppdaterSynlighet).observe(gameScreen, { attributes: true, attributeFilter: ['class'] });
    oppdaterSynlighet();

    var prev = localStorage.getItem(KEY);
    if (prev) apply(prev);
    window.sendVote = function(v) {
      if (localStorage.getItem(KEY)) return;
      localStorage.setItem(KEY, v);
      apply(v);
      fetch(FORM, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _source: 'Klokketrening', stemme: v === 'up' ? '👍' : '👎' })
      }).catch(function(){});
    };
  })();
  </script>

  <footer style="display:flex;justify-content:center;align-items:center;gap:0.75rem;padding:2rem 0 1.5rem;">
    <a href="https://uno.ganddal.net" target="_blank" rel="noopener" style="background:transparent;line-height:0;display:block;">
      <img src="../img/unohundlogo.png" alt="uno" height="16" style="display:block;">
    </a>
    <span style="font-size:0.75rem;color:#888888;">© 2026</span>
  </footer>
</body>
</html>
